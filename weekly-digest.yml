name: Weekly arXiv digest

on:
  schedule:
    # 06:00 UTC every Monday = 09:00 Istanbul. Adjust as you like.
    # cron is always UTC; format is "min hour day month weekday".
    - cron: "0 6 * * 7"
  workflow_dispatch: {}   # lets you trigger it by hand from the Actions tab

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run digest
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}  # optional
        run: python arxiv_digest.py --days 7
